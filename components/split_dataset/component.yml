$schema: https://azuremlschemas.azureedge.net/latest/commandComponent.schema.json

name: split_dataset
display_name: Split Turbofan Dataset
type: command

inputs:
  train_data:
    type: uri_file
  test_data:
    type: uri_file
  rul_data:
    type: uri_file
  sample_engines:
    type: integer
    default: 40
  seed:
    type: integer
    default: 42

outputs:
  train_out:
    type: uri_folder
  test_out:
    type: uri_folder
  rul_out:
    type: uri_folder

code: .
command: >
  python split.py
  --train_data ${{inputs.train_data}}
  --test_data ${{inputs.test_data}}
  --rul_data ${{inputs.rul_data}}
  --sample_engines ${{inputs.sample_engines}}
  --seed ${{inputs.seed}}
  --train_out ${{outputs.train_out}}
  --test_out ${{outputs.test_out}}
  --rul_out ${{outputs.rul_out}}

environment: azureml:AzureML-sklearn-1.1-ubuntu20.04-py38-cpu@latest